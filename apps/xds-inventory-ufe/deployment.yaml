apiVersion: apps/v1
kind: Deployment
metadata:
  name: xds-inventory-ufe-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      pod: xds-inventory-ufe-label
  template:
    metadata:
      labels:
        pod: xds-inventory-ufe-label
    spec:
      containers:
      - name: inventory-ufe-container
        image: xds/inventory-ufe
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            memory: "32M"
            cpu: "0.1"
          limits:
            memory: "320M"
            cpu: "0.3"
